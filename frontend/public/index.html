<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <!-- Знак «цена и стоимость»: favicon.svg сам меняет раскраску под тему
         браузера, .ico — для тех, кто SVG не понимает. -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="32x32" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c222c" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Стоимость российских акций по методу Грэма и Додда — из отчётов МСФО, без прогнозов аналитиков."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!-- Шрифты IBM Plex подключаются из сборки (src/index.tsx), без запросов к Google. -->
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Graham Analyzer</title>
    <!--
      FOUC prevention: ставим data-theme на <html> ДО загрузки React,
      чтобы избежать вспышки светлой темы при загрузке страницы у
      пользователей с выбранной dark/auto темой. Соответствует логике
      в src/contexts/ThemeContext.tsx.
    -->
    <script>
      (function () {
        try {
          var key = 'graham-analyzer:theme';
          var stored = localStorage.getItem(key);
          var resolved;
          if (stored === 'light' || stored === 'dark') {
            resolved = stored;
          } else {
            // 'auto' или ничего не сохранено → следуем системе
            resolved =
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          }
          document.documentElement.setAttribute('data-theme', resolved);
        } catch (_) {
          /* localStorage недоступен — оставляем дефолт (light) */
        }
      })();
    </script>
  </head>
  <body>
    <noscript>Для работы сайта нужен JavaScript.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
